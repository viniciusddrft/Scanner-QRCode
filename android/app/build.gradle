plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'dev.flutter.flutter-gradle-plugin'
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '40'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '40.0'
}

def loadKeystore(String name) {
    def props = new Properties()
    def f = rootProject.file(name)
    if (f.exists()) {
        props.load(new FileInputStream(f))
    }
    return props
}
def freeKeystore = loadKeystore('key.properties')
def premiumKeystore = loadKeystore('key-premium.properties')

android {
    namespace "com.scannerqrcode"
    compileSdkVersion 37
    ndkVersion "29.0.14033849" 

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        minSdkVersion 30
        targetSdkVersion 37
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    signingConfigs {
        free {
            keyAlias freeKeystore['keyAlias']
            keyPassword freeKeystore['keyPassword']
            storeFile freeKeystore['storeFile'] ? file(freeKeystore['storeFile']) : null
            storePassword freeKeystore['storePassword']
        }
        premium {
            keyAlias premiumKeystore['keyAlias']
            keyPassword premiumKeystore['keyPassword']
            storeFile premiumKeystore['storeFile'] ? file(premiumKeystore['storeFile']) : null
            storePassword premiumKeystore['storePassword']
        }
    }

    flavorDimensions "plan"
    productFlavors {
        free {
            dimension "plan"
            applicationId "com.scannerqrcode"
            resValue "string", "app_name", "Scanner QRCode"
            signingConfig signingConfigs.free
        }
        premium {
            dimension "plan"
            applicationId "com.scannerqrcode_premium"
            resValue "string", "app_name", "Scanner QRCode"
            signingConfig signingConfigs.premium
        }
    }

    buildTypes {
        release {
            ndk {
                abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86_64'
            }
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
    
    // Include all Flutter plugins
    def pluginsFile = new File(rootProject.projectDir.parent, '.flutter-plugins-dependencies')
    if (pluginsFile.exists()) {
        def jsonSlurper = new groovy.json.JsonSlurper()
        def pluginsData = jsonSlurper.parse(pluginsFile)
        pluginsData.plugins.android.each { plugin ->
            if (plugin.native_build) {
                implementation project(":${plugin.name}")
            }
        }
    }
}
